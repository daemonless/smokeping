icon: ':material-pulse:'
build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: pkg
      containerfile: Containerfile
      args:
        BASE_VERSION: "15.1"
    - tag: pkg-latest
      aliases: ["latest"]
      containerfile: Containerfile
      default: true
      args:
        BASE_VERSION: "15.1-latest"
cit:
  mode: screenshot
  port: 80
